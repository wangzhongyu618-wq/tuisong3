# ═══════════════════════════════════════════════════════════════
#                    TrendRadar 配置文件
#                    Version: 2.4.0
# ═══════════════════════════════════════════════════════════════

# ===============================================================
# 1. 基础设置
# ===============================================================
app:
  timezone: "Asia/Shanghai"
  show_version_update: true

# ===============================================================
# 1.5 调度系统
# ===============================================================
schedule:
  enabled: false                       # 改为 false：取消固定时段限制，每次运行抓到新消息即刻推送
  preset: "morning_evening"

# ===============================================================
# 2. 数据源 - 热榜平台
# ===============================================================
platforms:
  enabled: true
  api_url: ""
  sources:
    - id: "wallstreetcn-hot"
      name: "华尔街见闻"
      expected_domain: "wallstreetcn.com"
    - id: "cls-hot"
      name: "财联社热门"
      expected_domain: "cls.cn"

# ===============================================================
# 3. 数据源 - RSS 订阅
# ===============================================================
rss:
  enabled: true
  freshness_filter:
    enabled: true
    max_age_days: 1
  feeds:
    - id: "wsj-markets"
      name: "华尔街日报-金融市场"
      url: "[https://cn.wsj.com/zh-hans/rss/markets.xml](https://cn.wsj.com/zh-hans/rss/markets.xml)"
    - id: "jin10-macro"
      name: "金十数据-宏观与美联储"
      url: "[https://rsshub.app/jin10/topic/504](https://rsshub.app/jin10/topic/504)"
    - id: "hacker-news"
      name: "Hacker News"
      url: "[https://hnrss.org/frontpage](https://hnrss.org/frontpage)"
    - id: "ruanyifeng"
      name: "阮一峰的网络日志"
      url: "[http://www.ruanyifeng.com/blog/atom.xml](http://www.ruanyifeng.com/blog/atom.xml)"
      enabled: false
    - id: "cnbc-markets"
      name: "CNBC美股市场"
      url: "[https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=10000664](https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=10000664)"

# ===============================================================
# 3.5 数据源 - 雪球（Selenium 大V动态）
# ===============================================================
xueqiu:
  enabled: false                       # GitHub Actions 无登录 Cookie 时建议关闭，避免多余日志
  cookies: ""
  headless: true
  executable_path: ""
  target_urls: ["[https://xueqiu.com/](https://xueqiu.com/)"]
  max_posts: 10
  interval_minutes: 120

# ===============================================================
# 4. 报告模式
# ===============================================================
report:
  mode: "incremental"
  display_mode: "keyword"
  sort_by_position_first: false
  rank_threshold: 5
  max_news_per_keyword: 5

# ===============================================================
# 4.5 筛选策略
# ===============================================================
filter:
  method: "ai"
  priority_sort_enabled: true

# ===============================================================
# 4.6 AI 智能筛选配置
# ===============================================================
ai_filter:
  batch_size: 2                        # 适配 GLM-4.7 并发限制
  batch_interval: 2
  min_score: 0.55                      # 适当放宽阈值，防止财经热榜被过度过滤
  reclassify_threshold: 0.55
  prompt_file: "prompt.txt"
  extract_prompt_file: "extract_prompt.txt"
  update_tags_prompt_file: "update_tags_prompt.txt"

# ===============================================================
# 5. 推送内容控制
# ===============================================================
display:
  region_order:
    - ai_analysis
    - new_items
    - hotlist
    - rss
    - standalone
  regions:
    hotlist: true
    new_items: true
    rss: true
    standalone: false
    ai_analysis: true
  standalone:
    platforms: ["wallstreetcn-hot", "cls-hot"]
    rss_feeds: []
    max_items: 10

# ===============================================================
# 6. 推送通知（由 GitHub Secrets 注入）
# ===============================================================
notification:
  enabled: true
  channels:
    feishu:
      webhook_url: ""
    dingtalk:
      webhook_url: ""
    wework:
      webhook_url: ""
      msg_type: "markdown"
    telegram:
      bot_token: ""
      chat_id: ""
    email:
      from: ""
      password: ""
      to: ""
      smtp_server: ""
      smtp_port: ""
    ntfy:
      server_url: "[https://ntfy.sh](https://ntfy.sh)"
      topic: ""
      token: ""
    bark:
      url: ""
    slack:
      webhook_url: ""
    generic_webhook:
      webhook_url: ""
      payload_template: ""

# ===============================================================
# 7. 存储配置
# ===============================================================
storage:
  backend: "auto"
  formats:
    sqlite: true
    txt: false
    html: true
  local:
    data_dir: "output"
    retention_days: 30
  remote:
    retention_days: 0
    endpoint_url: ""
    bucket_name: ""
    access_key_id: ""
    secret_access_key: ""
    region: ""
  mysql:
    enabled: false                     # 关闭 MySQL，消除 GitHub Actions 上的连接拒绝刷屏报错
    host: "localhost"
    port: 3306
    username: "root"
    password: ""
    database: "trendradar"
    charset: "utf8mb4"
    pool_size: 10
    max_overflow: 20
  pull:
    enabled: false
    days: 7

# ===============================================================
# 8. AI 模型配置
# ===============================================================
ai:
  model: "openai/glm-4.7-flash"
  api_key: "58ee8ef517d0402f98c3f318e8062ca2.0Cby37ILwvXiyjZL"                          # 留白，请将重置后的智谱 API Key 填入 GitHub Secrets 的 AI_API_KEY
  api_base: "[https://open.bigmodel.cn/api/paas/v4](https://open.bigmodel.cn/api/paas/v4)"
  timeout: 120
  temperature: 0.7
  max_tokens: 5000
  num_retries: 2
  fallback_models: []

# ===============================================================
# 9. AI 分析功能
# ===============================================================
ai_analysis:
  enabled: true
  language: "Chinese"
  prompt_file: "ai_analysis_prompt.txt"
  mode: "follow_report"
  max_news_for_analysis: 150
  include_rss: true
  include_standalone: true
  include_rank_timeline: true
  enable_sentiment_extraction: true
  sentiment_extraction_prompt_file: "ai_sentiment_prompt.txt"
  enable_sector_mapping: true
  sector_mapping_file: "sector_mapping.yaml"

# ===============================================================
# 10. AI 翻译功能
# ===============================================================
ai_translation:
  enabled: true
  language: "中文"
  prompt_file: "ai_translation_prompt.txt"
  batch_size: 2                        # 适配 GLM-4.7 的并发限制
  batch_interval: 2
  scope:
    hotlist: false
    rss: true
    standalone: false

# ===============================================================
# 11. 高级设置
# ===============================================================
advanced:
  debug: false
  version_check_url: "[https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version](https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version)"
  mcp_version_check_url: "[https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_mcp](https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_mcp)"
  configs_version_check_url: "[https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_configs](https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_configs)"
  crawler:
    request_interval: 2000
    use_proxy: false
    default_proxy: "[http://127.0.0.1:10801](http://127.0.0.1:10801)"
  rss:
    request_interval: 1000
    timeout: 15
    use_proxy: false
    proxy_url: ""
  weight:
    rank: 0.6
    frequency: 0.3
    hotness: 0.1
  max_accounts_per_channel: 3
  batch_size:
    default: 4000
    dingtalk: 20000
    feishu: 30000
    bark: 4000
    slack: 4000
  batch_send_interval: 3
  feishu_message_separator: "━━━━━━━━━━━━━━━━"
